nt AKI), and osmolar gap accumulation calculator.","3% Hypertonic Saline Bolus & Sodium Target: 250–500 mL or 2–5 mL/kg dosing, acute sodium rise calculation (Adrogué–Madias), target sodium range (145–155 mmol/L), and hypernatremia safety cutoff alert (> 155 mmol/L).","Head-to-head Clinical Decision Matrix: Evidence-based guide comparing Mannitol vs 3% NaCl in shock/hypotension, CHF/volume overload, oliguria/renal failure, and baseline sodium abnormalities.","Cerebral Perfusion Pressure (CPP) Calculator: Calculates MAP and CPP (MAP − ICP) with target ranges (CPP 60–70 mmHg, ICP < 20–22 mmHg) and cerebral ischemia / hyperperfusion alerts (BTF & Neurocritical Care ENLS guidelines)."],bugs:[]},{version:"v1.4.0",date:"October 15, 2026",features:["Export to PNG: Download single fluid summary cards or multi-fluid comparison tables as high-resolution PNG images.","Expanded multiselect and comparison: Select up to 6 fluids with quick-remove column controls in the comparison modal.","Completed TOP Balance details: Added verified label values for osmolarity (294 mOsm/L), energy (21 kcal/L), and physiological pH 7.4 (6.5–8.0).","Added Human Albumin 20% (colloid) and Mannitol 20% (osmotic diuretic) with full compositions, registrations, and clinical warning flags.","Added pH filter: Filter crystalloids and colloids by solution pH range (< 6.0 acidic vs. 6.0–7.5 near-physiological).","Added Glucose Infusion Rate (GIR) Calculator: Dual calculation modes (rate-to-GIR and target-to-rate), maximal glucose oxidation limit alerts, and daily dextrose/caloric delivery."],bugs:[]},{version:"v1.3.0",date:"October 15, 2026",features:["Acute 3% NaCl bolus protocol for severe symptomatic hyponatraemia (seizures, coma): 100–150 mL (or 2 mL/kg) IV over 10–15 min, repeat timing, target acute rise (+4–6 mmol/L), daily limit (max 8 mmol/L/24h; 4–6 in high-risk ODS), and DDAVP overcorrection rescue (European & US guidelines).","Potassium replacement & safe rate guide: total body deficit estimation (Sterns / UpToDate), maximum infusion rate and concentration limits for peripheral (10 mmol/h, 40 mmol/L) and central lines (20 mmol/h, 80 mmol/L), alert against dextrose vehicles during initial repletion, and magnesium checking rule.","DKA / HHS fluid & electrolyte protocol: Katz corrected sodium calculator, phase 1 resuscitation (Hour 1 NSS 1000 mL/h), phase 2 fluid selection based on corrected Na (0.45% vs 0.9% NaCl), phase 3 dextrose addition thresholds (≤ 200–250 mg/dL in DKA, ≤ 300 in HHS), and potassium safety algorithm (hold insulin if K < 3.3 mmol/L; add 20–30 mmol/L if 3.3–5.2)."],bugs:[]},{version:"v1.2.1",date:"October 15, 2026",features:["The page description now covers all five countries (Thailand, US, UK, EU and Japan), not Thailand only.","Sodium change and water deficit guides: one-tap planned changes of 6, 8, 10 or 12 mmol/L; the sodium change guide also has Raise and Lower buttons."],bugs:[]},{version:"v1.1.0",date:"October 14, 2026",features:["18 crystalloid fluids used in Thailand: NSS, NSS/2, 3% NaCl, 5% and 10% dextrose, 5%D/NSS, 5%D/N/2 (also with KCl 20 or 40), 5%D/N/3, 5%D/N/4, 5%D/N/5, LRS, Acetar, Acetar-5, TOP Balance, Sterofundin ISO and Plasma-Lyte A.",'Each card shows sodium, potassium, chloride, calcium, magnesium, buffer, dextrose, energy, osmolarity and pH per litre, each with its source; values worked out from a printed formula are marked "calc.".',"Thai FDA registrations for every fluid, with a link to each register record (checked 14 October 2026).","Filters (type, sodium band, contents, Thai registration), search by short names such as NSS, D5W, DN/2, RLS, and by company, sort, tile and list views.","Compare up to three fluids side by side with human plasma.","Guides: fluid choice (NICE 5 Rs, Surviving Sepsis 2021), maintenance calculator (NICE CG174), sodium change per litre (Adrogué–Madias) and drip rate.","Country chips and registration status as in the bronchodilator guide: Thailand, US, UK, EU and Japan, each with the products found and a link to their record; filter by country and by status (current, past, never).","Water deficit guide for hypernatraemia: free water deficit, time to correct at a planned rate, and litres of each sodium-poor fluid for that day."],bugs:[]}],CHANGELOG_TH={"v1.5.0":{features:["แนวทางการใช้สารน้ำลดความดันในกะโหลกศีรษะ (ICP & Osmotherapy): คำนวณขนาดยาและการให้ Mannitol 20% เทียบกับ 3% Hypertonic Saline สำหรับภาวะความดันในกะโหลกศีรษะสูงวิกฤต","เครื่องคำนวณและข้อควรระวัง Mannitol 20%: คำนวณขนาดยา (กรัมและมิลลิลิตร) ตามน้ำหนักตัว (0.25–1.0 g/kg), แจ้งเตือนเวลาการให้ (15–20 นาที) และการใช้สายกรอง (in-line filter), ระบบตรวจสอบระดับ Serum Osmolality (< 320 mOsm/kg ป้องกันไตวายเฉียบพลัน) พร้อมการคำนวณ Osmolar Gap","คำนวณ 3% Hypertonic Saline Bolus: ขนาดยา 250–500 mL หรือ 2–5 mL/kg, คำนวณการเพิ่มขึ้นของโซเดียมในเลือดเฉียบพลัน (สูตร Adrogué–Madias), ควบคุมเป้าหมายโซเดียม (145–155 mmol/L) พร้อมการแจ้งเตือนเมื่อโซเดียมเกิน 155 mmol/L","ตารางเปรียบเทียบการเลือกใช้สารน้ำ (Decision Matrix): เปรียบเทียบข้อดีข้อเสียระหว่าง Mannitol vs 3% NaCl ในภาวะช็อก/ความดันโลหิตต่ำ, หัวใจวาย/น้ำเกิน, ไตวาย และระดับโซเดียมผิดปกติ","เครื่องคำนวณ Cerebral Perfusion Pressure (CPP): คำนวณ MAP และ CPP (MAP − ICP) พร้อมเป้าหมายตามเกณฑ์มาตรฐาน (CPP 60–70 mmHg, ICP < 20–22 mmHg) และแจ้งเตือนภาวะสมองขาดเลือดหรือเลือดไปเลี้ยงสมองมากเกินไป (Brain Trauma Foundation / ENLS)"],bugs:[]},"v1.4.0":{features:["ส่งออกเป็น PNG: ดาวน์โหลดการ์ดสรุปข้อมูลสารน้ำหรือตารางเปรียบเทียบเป็นรูปภาพ PNG คมชัดสูง","ปรับปรุงการเลือกหลายชนิดและเปรียบเทียบ: เลือกได้สูงสุด 6 ชนิด พร้อมปุ่มกดลบสารน้ำออกจากตารางเปรียบเทียบได้ทันที","เติมข้อมูล TOP Balance ครบถ้วน: เติมค่าฉลากออสโมลาริตี (294 mOsm/L) พลังงาน (21 kcal/L) และ pH 7.4 (6.5–8.0)","เพิ่ม Human Albumin 20% (คอลลอยด์) และ Mannitol 20% (สารขับปัสสาวะออสโมติก) พร้อมทะเบียนยาและคำเตือนทางคลินิก","เพิ่มตัวกรอง pH: กรองสารน้ำตามช่วงความเป็นกรด-ด่าง (< 6.0 กรด เทียบกับ 6.0–7.5 ใกล้เคียงพลาสมา)","เพิ่มเครื่องคำนวณ GIR (อัตราการให้กลูโคส): คำนวณได้ทั้งสองทิศทาง พร้อมการแจ้งเตือนขีดจำกัดการเผาผลาญกลูโคสและพลังงานต่อวัน"],bugs:[]},"v1.3.0":{features:["โปรโตคอล 3% NaCl bolus สำหรับโซเดียมต่ำรุนแรงที่มีอาการ (ชัก หมดสติ): 100–150 mL (หรือ 2 mL/kg) IV ใน 10–15 นาที การให้ซ้ำ เป้าหมายระยะเฉียบพลัน (+4–6 mmol/L) ขีดจำกัดต่อวัน (ไม่เกิน 8 mmol/L/24 ชม. และ 4–6 ในกลุ่มเสี่ยง ODS) และแนวทางแก้ไขเมื่อแก้เกินด้วย DDAVP (แนวทางยุโรปและสหรัฐฯ)","คู่มือการให้โพแทสเซียมและอัตราที่ปลอดภัย: ประมาณการโพแทสเซียมที่ขาดในร่างกาย (Sterns / UpToDate) ขีดจำกัดอัตราและความเข้มข้นทางหลอดเลือดดำส่วนปลาย (10 mmol/ชม., 40 mmol/L) และส่วนกลาง (20 mmol/ชม., 80 mmol/L) คำเตือนหลีกเลี่ยงเดกซ์โทรสในระยะแรก และการตรวจแมกนีเซียม","โปรโตคอลสารน้ำและอิเล็กโทรไลต์สำหรับ DKA / HHS: คำนวณโซเดียมปรับค่า (Katz) กู้ชีพชั่วโมงแรกด้วย NSS 1000 mL/ชม. การเลือกสารน้ำตาม Na ปรับค่า (0.45% เทียบกับ 0.9% NaCl) เกณฑ์การเติมเดกซ์โทรส (≤ 200–250 mg/dL ใน DKA, ≤ 300 ใน HHS) และอัลกอริทึมความปลอดภัยของโพแทสเซียม (ระงับอินซูลินถ้า K < 3.3 mmol/L และเติม 20–30 mmol/L ถ้า 3.3–5.2)"],bugs:[]},"v1.2.1":{features:["คำอธิบายหน้าแอปครอบคลุมทั้งห้าประเทศ (ไทย สหรัฐฯ สหราชอาณาจักร สหภาพยุโรป และญี่ปุ่น) ไม่ใช่เฉพาะไทย","คู่มือการเปลี่ยนแปลงโซเดียมและการขาดน้ำ: ปุ่มเลือกการเปลี่ยนแปลงที่วางแผน 6, 8, 10 หรือ 12 mmol/L และคู่มือการเปลี่ยนแปลงโซเดียมมีปุ่มเพิ่มและลด"],bugs:[]},"v1.1.0":{features:["สารน้ำคริสตัลลอยด์ 18 ชนิดที่ใช้ในประเทศไทย: NSS, NSS/2, 3% NaCl, 5% และ 10% เดกซ์โทรส, 5%D/NSS, 5%D/N/2 (และชนิดผสม KCl 20 หรือ 40), 5%D/N/3, 5%D/N/4, 5%D/N/5, LRS, Acetar, Acetar-5, TOP Balance, Sterofundin ISO และ Plasma-Lyte A",'แต่ละการ์ดแสดงโซเดียม โพแทสเซียม คลอไรด์ แคลเซียม แมกนีเซียม บัฟเฟอร์ เดกซ์โทรส พลังงาน ออสโมลาริตี และ pH ต่อลิตร พร้อมแหล่งอ้างอิง ค่าที่คำนวณจากสูตรตำรับจะมีเครื่องหมาย "คำนวณ"',"ทะเบียนยา อย. ของสารน้ำแต่ละชนิด พร้อมลิงก์ไปยังข้อมูลทะเบียนแต่ละรายการ (ตรวจสอบ 14 ตุลาคม 2569)","ตัวกรอง (ชนิด ช่วงโซเดียม ส่วนประกอบ ทะเบียนไทย) ค้นหาด้วยชื่อย่อ เช่น NSS, D5W, DN/2, RLS และชื่อบริษัท เรียงลำดับ มุมมองการ์ดและรายการ","เปรียบเทียบสารน้ำได้สูงสุด 3 ชนิด เทียบกับพลาสมา","คู่มือ: การเลือกสารน้ำ (NICE 5 Rs, Surviving Sepsis 2021) คำนวณสารน้ำบำรุงรักษา (NICE CG174) การเปลี่ยนแปลงโซเดียมต่อลิตร (Adrogué–Madias) และอัตราหยด","ชิปประเทศและสถานะทะเบียนแบบเดียวกับคู่มือยาขยายหลอดลม: ไทย สหรัฐฯ สหราชอาณาจักร สหภาพยุโรป และญี่ปุ่น พร้อมผลิตภัณฑ์ที่พบและลิงก์ไปยังข้อมูลทะเบียน กรองตามประเทศและสถานะ (ปัจจุบัน เคยมี ไม่เคยมี)","คู่มือการขาดน้ำสำหรับโซเดียมสูง: ปริมาณน้ำที่ขาด เวลาที่ใช้แก้ตามอัตราที่วางแผน และปริมาณสารน้ำที่มีโซเดียมต่ำแต่ละชนิดในวันนั้น"],bugs:[]}},APP_VERSION=changelogData[0].version,TH_MONTHS={January:"ม.ค.",February:"ก.พ.",March:"มี.ค.",April:"เม.ย.",May:"พ.ค.",June:"มิ.ย.",July:"ก.ค.",August:"ส.ค.",September:"ก.ย.",October:"ต.ค.",November:"พ.ย.",December:"ธ.ค."},thaiDate=e=>{const t=/^(\w+) (\d+), (\d{4})$/.exec(e);return t&&TH_MONTHS[t[1]]?`${t[2]} ${TH_MONTHS[t[1]]} ${+t[3]+543}`:e},translations={en:{isTh:!1,title:"Adult IV Fluid Guide",subtitle:"Crystalloid IV fluids in Thailand, the US, the UK, the EU and Japan: what is in each litre, where each is registered, and bedside calculators.",discLink:"Disclaimer and references ↓",themeToLight:"Switch to light mode",themeToDark:"Switch to dark mode",searchPlaceholder:"Search fluid, short name (NSS, D5W, RLS) or company…",searchPlaceholderShort:"Search fluids…",searchOpen:"Search",searchClose:"Close search",sortLabel:"Sort",sortType:"Type (saline first)",sortNameAsc:"Name (A–Z)",sortNaDesc:"Sodium (high → low)",sortNaAsc:"Sodium (low → high)",sortClAsc:"Chloride (low → high)",sortOsmAsc:"Osmolarity (low → high)",gridView:"Tile view",listView:"List view",filtersBtn:"Filters",typeLabel:"Type",families:{saline:"Saline",balanced:"Balanced",dextrose:"Dextrose",dexsaline:"Dextrose-saline",hypertonic:"Hypertonic",colloid:"Colloid"},familyLong:{saline:"Sodium chloride in water",balanced:"Balanced crystalloid (buffered)",dextrose:"Dextrose in water",dexsaline:"Dextrose with sodium chloride",hypertonic:"Hypertonic saline",colloid:"Colloid (plasma volume expander)"},naLabel:"Na⁺",naBands:{low:"< 130",resus:"130–154",high:"> 154"},naBandLong:{low:"Sodium below 130 mmol/L",resus:"Sodium 130–154 mmol/L",high:"Sodium above 154 mmol/L"},naTitle:"Sodium band. NICE CG174 1.3.1: crystalloids used for resuscitation contain sodium 130–154 mmol/L.",phLabel:"pH",phBands:{acidic:"< 6.0",physio:"6.0–7.5"},phBandLong:{acidic:"Acidic (pH < 6.0)",physio:"Near-physiological (pH 6.0–7.5)"},phTitle:"Solution pH range: acidic crystalloids vs near-physiological buffered solutions.",containsLabel:"Contains",contains:{k:"K⁺",ca:"Ca²⁺",mg:"Mg²⁺",glucose:"Glucose",buffer:"Buffer"},containsLong:{k:"Contains potassium",ca:"Contains calcium",mg:"Contains magnesium",glucose:"Contains glucose",buffer:"Contains a buffer"},thLabel:"Thai FDA",countriesLabel:"Countries",countriesAll:"All",countriesAllTitle:"Show every country",countryCodes:{th:"TH",us:"US",uk:"UK",eu:"EU",jp:"JP"},countryNames:{th:"Thailand",us:"United States",uk:"United Kingdom",eu:"European Union (Ireland list)",jp:"Japan"},regLabel:"FDA",regTitle:"Registration status in the selected countries",regOpts:{current:"Currently",past:"Past",never:"Never"},regStatus:{current:"registered",past:"registration ended",never:"not registered"},regNeverText:e=>`No product of this fluid and strength was found in ${e} (searched 14 Oct 2026).`,noCountry:"Choose at least one country.",registerNames:{th:"Thai FDA register",us:"Drugs@FDA",uk:"NHS dm+d",eu:"HPRA (Ireland)",jp:"PMDA"},regMatchNote:"Other countries: a product of the same fluid and strength on that country's list. Formulas can differ slightly between makers and countries (for example Hartmann's solution in the UK and Ireland); check the local label. UK = products supplied to the NHS (dm+d); EU = the Irish list (HPRA), plus the Dutch register for Sterofundin ISO.",regNotes:{jpNoHalf:"Japan: no 0.45% sodium chloride infusion was found.",uk27:"UK: 2.7% sodium chloride infusion is supplied instead (Fresenius Kabi).",jp10:"Japan: only 10% sodium chloride ampoules were found.",jpNoDexSaline:" Risk of hyperglycemia, hyperosmolarity, hepatic steatosis, and increased CO₂ production!",girWarnLow:"GIR is below basal hepatic glucose output (~2 mg/kg/min). Patient may develop hypoglycemia or catabolism if fasting without oral intake.",girFormula:"GIR (mg/kg/min) = [Rate (mL/h) × Dextrose (%) × 10] ÷ [Weight (kg) × 60]",girFormulaTarget:"Rate (mL/h) = [Target GIR (mg/kg/min) × Weight (kg) × 60] ÷ [Dextrose (%) × 10]",girPedsNote:"In neonates & infants, basal GIR requirement is higher (4–8 mg/kg/min due to larger brain-to-body ratio).",icpSub:"Acute intracranial hypertension & cerebral edema: Mannitol 20% vs. 3% Hypertonic Saline, osmolality limits & CPP monitoring",icpTabs:{mannitol:"Mannitol 20%",nacl3:"3% Hypertonic Saline",decision:"Decision Matrix",cpp:"CPP & MAP"},icpWeight:"Weight",icpManDoseLabel:"Mannitol Dose (g/kg)",icpManCalcGrams:"Dose in Grams",icpManCalcVol:"20% Volume to Infuse",icpManAdminTime:"Infuse IV bolus over 15–20 minutes using an in-line filter set (0.22–5 μm).",icpManKinetics:"Onset: 10–15 min | Peak: 20–60 min | Duration: 4–6 h",icpManOsmLabel:"Measured Serum Osmolality",icpManOsmSafe:"✓ Measured Serum Osmolality is below 320 mOsm/kg cutoff.",icpManOsmCaution:"⚠️ Serum Osmolality near threshold (310–320 mOsm/kg). Check renal function & recheck prior to further dosing.",icpManOsmDanger:"🚨 HOLD MANNITOL! Measured Serum Osmolality ≥ 320 mOsm/kg. Extreme risk of acute kidney injury (acute tubular necrosis) and hyperosmolality syndrome. Switch to 3% NaCl or alternative measures.",icpGapToggle:"Osmolar Gap Calculator",icpGapNa:"Serum Na⁺",icpGapGlu:"Glucose",icpGapBun:"BUN",icpGapCalcOsm:"Calculated Osm",icpGapVal:"Osmolar Gap",icpGapNormal:"✓ Osmolar gap ≤ 10 mOsm/kg: no evidence of significant mannitol accumulation.",icpGapHigh:"⚠️ Osmolar gap > 10–20 mOsm/kg: Indicates unexcreted mannitol accumulation. Hold further doses until gap clears!",icpManNotes:["Profound osmotic diuresis: Mannitol drives massive free water and electrolyte loss. Resultant hypovolemia and systemic hypotension critically reduce Cerebral Perfusion Pressure (CPP = MAP − ICP). Maintain euvolemia with isotonic crystalloids (NSS / balanced).","Rebound ICP increase: With repeated dosing or prolonged therapy, mannitol gradually crosses a disrupted blood-brain barrier (BBB), accumulating in brain parenchyma and reversing the osmotic gradient.","Crystallization: Mannitol may crystallize at cool temperatures. Inspect the bag/vial before use; warm and shake if crystals are visible; always use an in-line filter."],icpOpenMan:"Open Mannitol 20% Card",icpNacl3BolusLabel:"3% NaCl Bolus Dose",icpNacl3Vol:"Volume to Infuse",icpNacl3Admin:"Infuse IV bolus over 10–20 minutes. Emergency peripheral access (large-bore) acceptable for acute bolus; central line preferred for continuous infusions.",icpNacl3NaCurrent:"Current Serum Na⁺",icpNacl3Rise:"Anticipated Acute Na⁺ Rise",icpNacl3PredictedNa:"Predicted Post-Bolus Na⁺",icpNacl3TargetNote:"Target Serum Na⁺: 145–155 mmol/L (BTF / ENLS)",icpNacl3HighAlert:"🚨 HOLD 3% NaCl! Current serum Na⁺ ≥ 155 mmol/L (or post-bolus > 155–160 mmol/L). Severe hypernatremia risks renal vasoconstriction, seizures, and hyperchloremic acidosis.",icpNacl3Safe:"✓ Serum Na⁺ is within or approaching therapeutic target range (145–155 mmol/L).",icpNacl3Notes:["Volume expansion: Unlike mannitol, 3% NaCl expands intravascular volume and elevates MAP, which actively supports Cerebral Perfusion Pressure (CPP). It is preferred in trauma patients with concomitant hypotension or hypovolemic shock.","Acid-base monitoring: Infusate chloride is 513 mmol/L. High volumes or continuous infusions cause hyperchloremic non-anion gap metabolic acidosis and renal vasoconstriction. Monitor serum chloride and blood gas.","Osmolality ceiling: Serum osmolality up to 360 mOsm/kg is generally tolerated with hypertonic saline (higher than mannitol cutoff of 320 mOsm/kg).","Chronic hyponatremia: If herniation occurs on chronic hyponatremia, aim for acute initial +4–6 mmol/L rise to stop herniation, then adhere strictly to the 8–10 mmol/L/24h ceiling to prevent Osmotic Demyelination Syndrome (ODS)."],icpOpenNacl3:"Open 3% NaCl Card",icpDecisionTitle:"Osmotherapy Agent Selection: Head-to-Head Comparison",icpColCond:"Clinical Presentation",icpColAgent:"Preferred Osmotherapy",icpColReason:"Mechanism & Evidence Rationale",icpScenarios:[{cond:"Hypotension / Shock (MAP < 65 or SBP < 90 mmHg)",agent:"3% Hypertonic Saline",tone:"emerald",text:"3% NaCl expands intravascular volume and raises MAP/CPP. Mannitol causes osmotic diuresis and worsens hypovolemic hypotension (drops CPP)."},{cond:"Heart Failure / Pulmonary Edema / Hypervolemia",agent:"Mannitol 20%",tone:"blue",text:"Mannitol acts as an osmotic diuretic, promoting net fluid excretion. 3% NaCl increases intravascular volume and can precipitate pulmonary edema."},{cond:"Renal Insufficiency / Oliguria (Osm > 320 mOsm/kg)",agent:"3% Hypertonic Saline",tone:"emerald",text:"Mannitol is nephrotoxic when serum Osm ≥ 320 mOsm/kg or in anuria. 3% NaCl can be titrated safely up to serum Osm 360 mOsm/kg and Na 155 mmol/L."},{cond:"Baseline Hyponatremia (Na < 135 mmol/L)",agent:"3% Hypertonic Saline",tone:"emerald",text:"3% NaCl corrects hyponatremia while reducing cerebral edema. Mannitol lowers serum sodium via free water mobilization and diuresis."},{cond:"Baseline Hypernatremia (Na > 150 mmol/L)",agent:"Mannitol 20%",tone:"blue",text:"Mannitol is preferred if serum Osm < 320 mOsm/kg. 3% NaCl is contraindicated if serum Na exceeds 155 mmol/L."}],icpCppTitle:"Cerebral Perfusion Pressure (CPP) & MAP Calculator",icpSbp:"Systolic BP (SBP)",icpDbp:"Diastolic BP (DBP)",icpMap:"Mean Arterial Pressure (MAP)",icpIcpVal:"Intracranial Pressure (ICP)",icpCppVal:"Cerebral Perfusion Pressure (CPP)",icpTargetCpp:"Target CPP: 60–70 mmHg",icpTargetIcp:"Target ICP: < 20–22 mmHg (BTF Guidelines)",icpCppLowAlert:"🚨 CPP < 60 mmHg: High risk of cerebral ischemia! Augment MAP (fluid resuscitation, vasopressors) and reduce ICP (elevate head 30°, osmotherapy, CSF drainage, sedation).",icpCppHighAlert:"⚠️ CPP > 70 mmHg: Excessive cerebral perfusion pressure. Avoid inducing hypertension; risk of cerebral hyperperfusion injury and ARDS.",icpIcpHighAlert:"🚨 ICP > 22 mmHg: Pathological intracranial hypertension! Escalate neurocritical care interventions immediately.",icpCppNormal:"✓ CPP is within optimal target range (60–70 mmHg).",icpCppFormula:"MAP = DBP + (SBP − DBP) / 3 | CPP = MAP − ICP"},th:{chooseSub:'NICE CG174 "5 Rs" และ Surviving Sepsis Campaign 2021',tabs:{resus:"กู้ชีพ",maint:"บำรุงรักษา",replace:"ทดแทนและกระจายตัว",reassess:"ประเมินซ้ำ"},resus:[["อาการที่บ่งว่าอาจต้องให้สารน้ำกู้ชีพเร่งด่วน: ความดันซิสโตลิกต่ำกว่า 100 mmHg ชีพจรเกิน 90/นาที capillary refill เกิน 2 วินาทีหรือปลายมือเท้าเย็น หายใจเกิน 20/นาที NEWS ตั้งแต่ 5 หรือ passive leg raise ให้ผลบวก","nice","1.2.1"],["ใช้คริสตัลลอยด์ที่มีโซเดียม 130–154 mmol/L ให้ bolus 500 mL ภายในไม่เกิน 15 นาที แล้วประเมินซ้ำ (ABCDE)","nice","1.3.1"],["ภาวะติดเชื้อในกระแสเลือดหรือช็อกจากการติดเชื้อ: คริสตัลลอยด์เป็นสารน้ำทางเลือกแรก (คำแนะนำหนักแน่น) แนะนำ balanced crystalloid มากกว่า normal saline (คำแนะนำอ่อน หลักฐานคุณภาพต่ำ)","ssc",""],["ภาวะ hypoperfusion จากการติดเชื้อหรือช็อกจากการติดเชื้อ: แนะนำคริสตัลลอยด์อย่างน้อย 30 mL/kg ภายใน 3 ชั่วโมงแรก (คำแนะนำอ่อน หลักฐานคุณภาพต่ำ)","ssc",""]],resusList:"สารน้ำในแอปที่มีโซเดียม 130–154 mmol/L และไม่มีกลูโคส",maint:[["สำหรับบำรุงรักษาอย่างเดียว: น้ำ 25–30 mL/kg/วัน โพแทสเซียม โซเดียม และคลอไรด์ อย่างละประมาณ 1 mmol/kg/วัน และกลูโคส 50–100 g/วัน","nice","1.4.1"],["ผู้ป่วยอ้วน: ใช้น้ำหนักตัวในอุดมคติและปริมาณต่อ kg ช่วงล่าง ผู้ป่วยแทบไม่ต้องการเกิน 3 L/วัน ปรึกษาผู้เชี่ยวชาญถ้า BMI เกิน 40","nice","1.4.2"],["พิจารณาให้น้อยลง (20–25 mL/kg/วัน) ในผู้สูงอายุหรือเปราะบาง ไตบกพร่องหรือหัวใจล้มเหลว และภาวะขาดอาหารที่เสี่ยง refeeding","nice","1.4.3"],["ตัวอย่าง: 0.18% NaCl ใน 4% กลูโคส ผสมโพแทสเซียม 27 mmol/L ขนาด 25–30 mL/kg/วัน ในวันแรก การให้เกิน 2.5 L/วัน เพิ่มความเสี่ย
